# Docker compose file to test locally builds for redhat
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./redhat/Dockerfile

services:
  redhat-decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        REDHAT_TAG: "9.7"
        REDHAT_REPO: "ubi9"
        DECIDIM_VERSION: "0.32.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "77ccd73229f977a71ab3600b3d2cd619c6f0b362"
        VCS_REF_SHORT: "77ccd732"
        VCS_REF_DATE: "2026-02-10"
        VERSION: "0.32.0.dev"
        BUILD_DATE: "2026-02-10T23:37:18+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  redhat-decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        REDHAT_TAG: "9.7"
        REDHAT_REPO: "ubi9"
        DECIDIM_VERSION: "0.31.1"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "ce9f0e42bab4ed98385e0bcb54275a7a0666b66b"
        VCS_REF_SHORT: "ce9f0e42"
        VCS_REF_DATE: "2026-02-11"
        VERSION: "0.31.1"
        BUILD_DATE: "2026-02-10T23:37:18+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  redhat-decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        REDHAT_TAG: "9.7"
        REDHAT_REPO: "ubi9"
        DECIDIM_VERSION: "0.30.5"
        DECIDIM_BRANCH: "release/0.30-stable"
        NODE_MAJOR_VERSION: "18"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "dc12cc9fe65cc648bbc82816ce8ec153b18e7bb6"
        VCS_REF_SHORT: "dc12cc9f"
        VCS_REF_DATE: "2026-02-10"
        VERSION: "0.30.5"
        BUILD_DATE: "2026-02-10T23:37:19+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: