# Docker compose file to test locally builds for redhat
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./redhat/Dockerfile

services:
  redhat-decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "ubi9"
        OS_VERSION: "9.8"
        OS_MAJOR_VERSION: "9"
        DECIDIM_VERSION: "0.33.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "24"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "8b1eb46684848a2f2940a9b8d1cc8e2de8acd32e"
        VCS_REF_SHORT: "8b1eb466"
        VCS_REF_DATE: "2026-08-21"
        VERSION: "0.33.0.dev"
        BUILD_DATE: "2026-08-22T23:18:23+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  redhat-decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "ubi9"
        OS_VERSION: "9.8"
        OS_MAJOR_VERSION: "9"
        DECIDIM_VERSION: "0.32.1"
        DECIDIM_BRANCH: "release/0.32-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "aa95fdab8687976056eff30f97c470e42e274198"
        VCS_REF_SHORT: "aa95fdab"
        VCS_REF_DATE: "2026-08-21"
        VERSION: "0.32.1"
        BUILD_DATE: "2026-08-22T23:18:23+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  redhat-decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "ubi9"
        OS_VERSION: "9.8"
        OS_MAJOR_VERSION: "9"
        DECIDIM_VERSION: "0.31.7"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "6e87078ba493081649ccf6b63e1a64968c10b242"
        VCS_REF_SHORT: "6e87078b"
        VCS_REF_DATE: "2026-08-21"
        VERSION: "0.31.7"
        BUILD_DATE: "2026-08-22T23:18:24+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: