# Docker compose file to test locally builds for redhat
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./redhat/Dockerfile

services:
  redhat-decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        REDHAT_TAG: "9.7"
        REDHAT_REPO: "ubi9"
        DECIDIM_VERSION: "0.33.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "505027a1f950f14e31664b7087e70429b168a6c2"
        VCS_REF_SHORT: "505027a1"
        VCS_REF_DATE: "2026-05-10"
        VERSION: "0.33.0.dev"
        BUILD_DATE: "2026-05-10T23:51:41+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  redhat-decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        REDHAT_TAG: "9.7"
        REDHAT_REPO: "ubi9"
        DECIDIM_VERSION: "0.32.0.rc1"
        DECIDIM_BRANCH: "release/0.32-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "8e483c12c70d1d9c24dedd569cb517312601ad9b"
        VCS_REF_SHORT: "8e483c12"
        VCS_REF_DATE: "2026-05-10"
        VERSION: "0.32.0.rc1"
        BUILD_DATE: "2026-05-10T23:51:41+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  redhat-decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        REDHAT_TAG: "9.7"
        REDHAT_REPO: "ubi9"
        DECIDIM_VERSION: "0.31.4"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "023e206127c984a501345676e4789b31ddd115a1"
        VCS_REF_SHORT: "023e2061"
        VCS_REF_DATE: "2026-05-10"
        VERSION: "0.31.4"
        BUILD_DATE: "2026-05-10T23:51:42+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: