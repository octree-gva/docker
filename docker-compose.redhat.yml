# Docker compose file to test locally builds for redhat
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./redhat/Dockerfile

services:
  redhat-decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "ubi9"
        OS_VERSION: "9.8"
        OS_MAJOR_VERSION: "9"
        DECIDIM_VERSION: "0.33.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "24"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "d40d46aa57545398d84fb1fb485aa5cc65e25111"
        VCS_REF_SHORT: "d40d46aa"
        VCS_REF_DATE: "2026-09-11"
        VERSION: "0.33.0.dev"
        BUILD_DATE: "2026-09-13T00:36:51+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  redhat-decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "ubi9"
        OS_VERSION: "9.8"
        OS_MAJOR_VERSION: "9"
        DECIDIM_VERSION: "0.32.1"
        DECIDIM_BRANCH: "release/0.32-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "ba1914c398a1e32598362b638b2687a290a5dbf0"
        VCS_REF_SHORT: "ba1914c3"
        VCS_REF_DATE: "2026-09-10"
        VERSION: "0.32.1"
        BUILD_DATE: "2026-09-13T00:36:51+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  redhat-decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "ubi9"
        OS_VERSION: "9.8"
        OS_MAJOR_VERSION: "9"
        DECIDIM_VERSION: "0.31.7"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "411ce2f872095fda3a2b4c2edf12fc40fffbd7f3"
        VCS_REF_SHORT: "411ce2f8"
        VCS_REF_DATE: "2026-09-10"
        VERSION: "0.31.7"
        BUILD_DATE: "2026-09-13T00:36:52+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: