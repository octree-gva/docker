services: 
  # As example, we use here nginx. 
  # Feel free to use any other proxy, like HaProxy, etc.
  nginx:
    container_name: proxy
    build: 
      dockerfile_inline: |
        FROM nginx:1.25-alpine
        ADD https://raw.githubusercontent.com/decidim/docker/master/contrib/nginx/nginx.conf /etc/nginx/nginx.conf
    networks:
      - private
      - default
    links:
      - decidim
    ports:
      - 8080:8080
    depends_on:
      - decidim
    volumes:
      - decidim_public:/usr/share/nginx/html

  decidim:
    image: decidim/decidim:0.29.2
    ports:
      - "3000:3000"
    environment:
      - DECIDIM_DATABASE_HOST=db
      - DECIDIM_DATABASE_USER=postgres
      - DECIDIM_DATABASE_PASSWORD=postgres
      - DECIDIM_DATABASE_NAME=decidim_development
      - DECIDIM_REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=insecure_key_base
      - RAILS_ENV=production
      - NODE_ENV=production
      - DECIDIM_MAILER_SENDER=changeme@example.org
      - QUEUE_ADAPTER=async
    volumes:  
      - decidim_public:/home/decidim/public
    networks:
      - private
    depends_on:
      - redis
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - private

volumes:
  decidim_public:
  redis_data:
  postgres_data:  
