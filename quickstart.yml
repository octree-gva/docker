services: 
  # As example, we use here nginx. 
  # Feel free to use any other proxy, like HaProxy, etc.
  nginx:
    container_name: proxy
    build: 
      dockerfile_inline: |
        FROM nginx:1.25-alpine
        ADD https://raw.githubusercontent.com/octree-gva/docker/feat/better-decidim-docker/contrib/nginx/nginx.conf /etc/nginx/nginx.conf
    networks:
      - private
      - default
    links:
      - decidim
    ports:
      - 8080:8080
    depends_on:
      - decidim
    volumes:
      - decidim_public:/usr/share/nginx/html:ro

  decidim:
    image: hfroger/decidim:0.31.0
    ports:
      - "3000:3000"
    environment:
      - DECIDIM_DATABASE_HOST=db
      - DECIDIM_DATABASE_USER=postgres
      - DECIDIM_DATABASE_PASSWORD=postgres
      - DECIDIM_DATABASE_NAME=decidim_production
      - DECIDIM_REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=insecure_key_base
      - RAILS_ENV=production
      - NODE_ENV=production
      - DECIDIM_MAILER_SENDER=changeme@example.org
      - QUEUE_ADAPTER=async
      - RAILS_FORCE_SSL=false
    volumes:  
      - decidim_public:/home/decidim/public
    networks:
      - private
    depends_on:
      - redis
      - db

  db:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=decidim_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - private

volumes:
  decidim_public:
  redis_data:
  postgres_data:  
  
networks:
  private: