name: Build docker images

env:
  VERBOSE: 1
  DOCKER_HUB_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

on:
  workflow_dispatch:
  schedule:
    # Every day at 17:30, we udpdate images
    - cron:  '30 17 * * *'

jobs:
  ubuntu-decidim-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          bundle install
          bundle exec rake docker:build:ubuntu[dev]
      - name: Push image
        run: |
          bundle exec rake docker:push:ubuntu[dev]
      - name: Clean Docker clone directory
        run: |
          bundle exec rake docker:clean
          
  ubuntu-decidim-last:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          bundle install
          bundle exec rake docker:build:ubuntu[last]
      - name: Push image
        run: |
          bundle exec rake docker:push:ubuntu[last]
      - name: Clean Docker clone directory
        run: |
          bundle exec rake docker:clean

  ubuntu-decidim-prev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          bundle install
          bundle exec rake docker:build:ubuntu[prev]
      - name: Push image
        run: |
          bundle exec rake docker:push:ubuntu[prev]
      - name: Clean Docker clone directory
        run: |
          bundle exec rake docker:clean
          

  repository-documentation:
    runs-on: ubuntu-latest
    # Needs to run after images pushes, as we will update images
    # descriptions
    needs: [ubuntu-decidim-development, ubuntu-decidim-last, ubuntu-decidim-prev]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Update README
        run: |
          bundle install
          bundle exec rake docker:docs
      - name: Push README to docker hub
        run: |
          docker run --rm -e DOCKER_USER=${{ secrets.DOCKERHUB_USERNAME }} \
            -v $(pwd):/myvol \
            -e DOCKER_PASS=${{ secrets.DOCKERHUB_TOKEN }} \
            -e PUSHRM_SHORT="Decidim docker images" \
            -e PUSHRM_TARGET="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/decidim" \
            -e PUSHRM_DEBUG=1 \
            -e PUSHRM_FILE=/myvol/README.md chko/docker-pushrm
      - name: Commit and push changes
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update documentation"
          git push