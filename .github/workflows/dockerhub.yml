name: Build docker images

on:
  workflow_dispatch:
  schedule:
    # Every day at 17:30, we udpdate images
    - cron:  '30 17 * * *'

jobs:
  decidim-development:
    runs-on: ubuntu-25.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          export VERBOSE=1
          bundle exec rake docker:build[dev]
      - name: Push image
        run: |
          export VERBOSE=1
          export DOCKERHUB_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          bundle exec rake docker:push[dev]
      - name: Clean Docker clone directory
        run: |
          export VERBOSE=1
          bundle exec rake docker:clean
          
  decidim-last:
    runs-on: ubuntu-25.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          export VERBOSE=1
          bundle exec rake docker:build[last]
      - name: Push image
        run: |
          export VERBOSE=1
          export DOCKERHUB_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          bundle exec rake docker:push[last]
      - name: Clean Docker clone directory
        run: |
          export VERBOSE=1
          bundle exec rake docker:clean

  decidim-prev:
    runs-on: ubuntu-25.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          export VERBOSE=1
          bundle exec rake docker:build[prev]
      - name: Push image
        run: |
          export VERBOSE=1
          export DOCKERHUB_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          bundle exec rake docker:push[prev]
      - name: Clean Docker clone directory
        run: |
          export VERBOSE=1
          bundle exec rake docker:clean
          

  repository-documentation:
    runs-on: ubuntu-25.04
    # Needs to run after images pushes, as we will update images
    # descriptions
    needs: [decidim-development, decidim-last, decidim-prev]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Update README
        run: |
          bundle exec docker:docs
      - name: Push README to docker hub
        run: |
          docker run --rm -e DOCKER_USER=${{ secrets.DOCKERHUB_USERNAME }} \
            -v $(pwd):/myvol \
            -e DOCKER_PASS=${{ secrets.DOCKERHUB_TOKEN }} \
            -e PUSHRM_SHORT="Decidim docker images" \
            -e PUSHRM_TARGET="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/decidim" \
            -e PUSHRM_DEBUG=1 \
            -e PUSHRM_FILE=/myvol/README.md chko/docker-pushrm
      - name: Commit and push changes
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update documentation"
          git push