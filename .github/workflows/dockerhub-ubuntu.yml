name: Build Decidim Docker images (Ubuntu)

env:
  VERBOSE: 1
  DOCKER_HUB_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

on:
  workflow_dispatch:
  schedule:
    # Every day at 17:00, we udpdate images
    - cron:  '00 17 * * *'

jobs:
  ubuntu-decidim-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          setup-rbenv: true
      - name: Build image
        run: |
          bundle install
          bundle exec rake docker:build:ubuntu[dev]
      - name: Push image
        run: |
          bundle exec rake docker:push:ubuntu[dev]
      - name: Clean Docker clone directory
        run: |
          bundle exec rake docker:clean
          
