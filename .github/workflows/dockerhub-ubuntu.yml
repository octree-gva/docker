name: Build Decidim Docker images (Ubuntu)

concurrency:
  group: docker-publish-${{ github.workflow }}
  cancel-in-progress: true

env:
  VERBOSE: 1
  DOCKER_HUB_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BUILDX_CACHE: 1

on:
  workflow_dispatch:
  schedule:
    - cron: '00 17 * * *'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: dev, os_name: noble, push_aliases: true }
          - { version: dev, os_name: resolute }
          - { version: last, os_name: noble, push_aliases: true }
          - { version: last, os_name: resolute }
          - { version: prev, os_name: noble, push_aliases: true }
          - { version: prev, os_name: resolute }
          - { version: legacy, os_name: noble, push_aliases: true }
          - { version: legacy, os_name: resolute }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build image
        run: bundle exec rake "docker:build:ubuntu_one[${{ matrix.version }},${{ matrix.os_name }}]"
      - name: Smoke test (libvips, codecs, no ImageMagick, rails PATH)
        run: |
          IMAGE="$(bundle exec rake -s "docker:image_ref[ubuntu,${{ matrix.version }},${{ matrix.os_name }}]")"
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh "$IMAGE"
      - name: Push image
        if: success()
        env:
          PUSH_VERSION_ALIASES: ${{ matrix.push_aliases == true && '1' || '0' }}
        run: bundle exec rake "docker:push:ubuntu_one[${{ matrix.version }},${{ matrix.os_name }}]"
      - name: Clean Docker clone directory
        if: always()
        run: bundle exec rake docker:clean
