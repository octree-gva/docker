name: Refresh documentation

permissions:
  contents: write

concurrency:
  group: docker-publish-${{ github.workflow }}
  cancel-in-progress: true

env:
  VERBOSE: 1
  DOCKER_HUB_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  repository-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Update README
        run: bundle exec rake docker:docs
      - name: Push README to docker hub
        run: |
          docker run --rm -e DOCKER_USER=${{ secrets.DOCKERHUB_USERNAME }} \
            -v $(pwd):/myvol \
            -e DOCKER_PASS=${{ secrets.DOCKERHUB_TOKEN }} \
            -e PUSHRM_SHORT="Decidim docker images" \
            -e PUSHRM_TARGET="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/decidim" \
            -e PUSHRM_DEBUG=1 \
            -e PUSHRM_FILE=/myvol/README.md chko/docker-pushrm
      - name: Commit and push changes
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update documentation"
          git push
