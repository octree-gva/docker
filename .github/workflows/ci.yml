name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
      - name: Render docs templates
        run: bundle exec rake docker:docs
      - name: Version deps script
        run: |
          chmod +x docker/context/bin/apply-version-deps
          DECIDIM_VERSION=0.31.1 VERSION_DEPS_ROOT=./docker/version-deps \
            ./docker/context/bin/apply-version-deps list npm | grep -q workbox-webpack-plugin
          test -z "$(DECIDIM_VERSION=0.29.7 VERSION_DEPS_ROOT=./docker/version-deps ./docker/context/bin/apply-version-deps list npm)"

  build-ubuntu:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build Ubuntu image
        run: bundle exec rake "docker:build:ubuntu_one[last,noble]"
      - name: Smoke test Ubuntu image
        run: |
          IMAGE="$(bundle exec rake -s "docker:image_ref[ubuntu,last,noble]")"
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh "$IMAGE"

  build-redhat:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Rubies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build Red Hat image
        run: bundle exec rake "docker:build:redhat_one[last,ubi9]"
      - name: Smoke test Red Hat image
        run: |
          IMAGE="$(bundle exec rake -s "docker:image_ref[redhat,last,ubi9]")"
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh "$IMAGE"
