# NOTICE
# [`rake docker:docs`] This file is generated from a template
#   @see ./templates/docker-compose.yml.erb


# Docker compose file to test locally builds
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: development
  NODE_ENV: development

x-default-build: &default-build
  context: ./docker
  dockerfile: ./Dockerfile

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        DECIDIM_VERSION: 0.31.0.dev
        DECIDIM_BRANCH: develop
        NODE_MAJOR_VERSION: 22
        BUNDLER_VERSION: 2.4.20
        RUBY_VERSION: 3.3.4
        VCS_REF: d3ba111fc89db1d8e6e11c668d2843acb7b9c5fa
        VERSION: 0.31.0.dev
        BUILD_DATE: 2025-04-29T05:59:34+00:00
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        DECIDIM_VERSION: 0.30.0.rc3
        DECIDIM_BRANCH: release/0.30-stable
        NODE_MAJOR_VERSION: 18
        BUNDLER_VERSION: 2.4.20
        RUBY_VERSION: 3.3.4
        VCS_REF: 391926273eafb20df66dd73b8e63964c2e0ff60c
        VERSION: 0.30.0.rc3
        BUILD_DATE: 2025-04-29T05:59:35+00:00
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        DECIDIM_VERSION: 0.29.2
        DECIDIM_BRANCH: release/0.29-stable
        NODE_MAJOR_VERSION: 18
        BUNDLER_VERSION: 2.4.6
        RUBY_VERSION: 3.2.2
        VCS_REF: 9f371e1e8b89345e2fdf55b1167c3cf7d2dc37aa
        VERSION: 0.29.2
        BUILD_DATE: 2025-04-29T05:59:36+00:00
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: