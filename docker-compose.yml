  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev,decidim_legacy,decidim_old
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

