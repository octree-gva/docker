# Docker compose file to test locally builds for ubuntu
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./ubuntu/Dockerfile

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "24.04"
        DECIDIM_VERSION: "0.33.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "493d49526bb445dfe08eecb65c4f7ce24da9b016"
        VCS_REF_SHORT: "493d4952"
        VCS_REF_DATE: "2026-05-08"
        VERSION: "0.33.0.dev"
        BUILD_DATE: "2026-05-09T23:45:42+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "24.04"
        DECIDIM_VERSION: "0.30.8"
        DECIDIM_BRANCH: "release/0.30-stable"
        NODE_MAJOR_VERSION: "18"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "aab7f0affb8a62d5fb76060f4a574fb8e788f37f"
        VCS_REF_SHORT: "aab7f0af"
        VCS_REF_DATE: "2026-05-10"
        VERSION: "0.30.8"
        BUILD_DATE: "2026-05-09T23:45:42+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "24.04"
        DECIDIM_VERSION: "0.31.4"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "af0a3890e2d73c23e2cd8e49abdefa5202011fde"
        VCS_REF_SHORT: "af0a3890"
        VCS_REF_DATE: "2026-05-09"
        VERSION: "0.31.4"
        BUILD_DATE: "2026-05-09T23:45:42+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: