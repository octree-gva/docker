# NOTICE
# [`rake docker:docs`] This file is generated from a template
#   @see ./templates/docker-compose.yml.erb


# Docker compose file to test locally builds
x-default: &default
  ports:
    - "3000:3000"
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  DATABASE_HOST: db
  DATABASE_USER: postgres
  DATABASE_PASSWORD: insecure_password
  DATABASE_NAME: decidim_development
  RAILS_ENV: development
  NODE_ENV: development

x-default-build: &default-build
  context: ./docker
  dockerfile: ./Dockerfile

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        DECIDIM_VERSION: 0.31.0.dev
        DECIDIM_BRANCH: develop
        NODE_MAJOR_VERSION: 22
        BUNDLER_VERSION: 2.4.20
        RUBY_VERSION: 3.3.4
        VCS_REF: 5f3161de15e612947af8c919c3a211be1eeedd20
        VERSION: 0.31.0.dev
        BUILD_DATE: 2025-04-28T06:27:38+01:00
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DECIDIM_DATABASE_NAME: decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        DECIDIM_VERSION: 0.30.0.rc3
        DECIDIM_BRANCH: release/0.30-stable
        NODE_MAJOR_VERSION: 18
        BUNDLER_VERSION: 2.4.20
        RUBY_VERSION: 3.3.4
        VCS_REF: 74c583aa98bcfa8c98f9ce3f31e375e40880af43
        VERSION: 0.30.0.rc3
        BUILD_DATE: 2025-04-28T06:27:38+01:00
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DECIDIM_DATABASE_NAME: decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        DECIDIM_VERSION: 0.29.2
        DECIDIM_BRANCH: release/0.29-stable
        NODE_MAJOR_VERSION: 18
        BUNDLER_VERSION: 2.4.6
        RUBY_VERSION: 3.2.2
        VCS_REF: 03711508dd4cad8852b6bc687cc25420d202089d
        VERSION: 0.29.2
        BUILD_DATE: 2025-04-28T06:27:39+01:00
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DECIDIM_DATABASE_NAME: decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      - create_db

  # Create development, last, and prev databases 
  create_db:
    image: postgres:16
    command: >
      sh -c "
        until pg_isready -U postgres -d postgres; do
          sleep 1;
          echo 'Waiting for PostgreSQL to be ready...';
        done;
        psql -U decidim -c 'CREATE DATABASE decidim_development;'
        psql -U decidim -c 'CREATE DATABASE decidim_last;'
        psql -U decidim -c 'CREATE DATABASE decidim_prev;'
      "
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
    healthcheck:
      # Check decidim_prev DB is created
      test: ["CMD", "psql", "-U", "postgres", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data: