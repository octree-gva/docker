# Docker compose file to test locally builds for ubuntu
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./ubuntu/Dockerfile

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "24.04"
        DECIDIM_VERSION: "0.32.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "62c09c00da3b25dc4851ccec0553e3d0a32a358a"
        VCS_REF_SHORT: "62c09c00"
        VCS_REF_DATE: "2026-04-21"
        VERSION: "0.32.0.dev"
        BUILD_DATE: "2026-04-21T23:34:07+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "24.04"
        DECIDIM_VERSION: "0.31.3"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "73396b4477a6aefecb441b66450bebdc22aab23b"
        VCS_REF_SHORT: "73396b44"
        VCS_REF_DATE: "2026-04-21"
        VERSION: "0.31.3"
        BUILD_DATE: "2026-04-21T23:34:07+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "24.04"
        DECIDIM_VERSION: "0.30.7"
        DECIDIM_BRANCH: "release/0.30-stable"
        NODE_MAJOR_VERSION: "18"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "6e556b59cc8ec4353c15355b5b72d29f1024242c"
        VCS_REF_SHORT: "6e556b59"
        VCS_REF_DATE: "2026-04-21"
        VERSION: "0.30.7"
        BUILD_DATE: "2026-04-21T23:34:07+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: