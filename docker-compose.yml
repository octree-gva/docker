# Docker compose file to test locally builds
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./Dockerfile.ubuntu

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "25.04"
        DECIDIM_VERSION: "0.31.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "4b6c35635ba04e2d08ec650f8354e1733a1cf560"
        VERSION: "0.31.0.dev"
        BUILD_DATE: "2025-08-08T10:36:42+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "25.04"
        DECIDIM_VERSION: "0.30.1"
        DECIDIM_BRANCH: "release/0.30-stable"
        NODE_MAJOR_VERSION: "18"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "07e137214f04a0dfdcdbb03edc79560ca4cd3953"
        VERSION: "0.30.1"
        BUILD_DATE: "2025-08-08T10:36:43+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "25.04"
        DECIDIM_VERSION: "0.29.4"
        DECIDIM_BRANCH: "release/0.29-stable"
        NODE_MAJOR_VERSION: "18"
        BUNDLER_VERSION: "2.4.6"
        RUBY_VERSION: "3.2.2"
        VCS_REF: "d6d17c566caa98f91112ff786e7af67cb0c4faa3"
        VERSION: "0.29.4"
        BUILD_DATE: "2025-08-08T10:36:44+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: