# Docker compose file to test locally builds for ubuntu
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./ubuntu/Dockerfile

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "noble"
        OS_VERSION: "24.04"
        OS_MAJOR_VERSION: "24"
        DECIDIM_VERSION: "0.33.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "24"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "2610324f55cfd1db6d745ab8c33cf6f5fe3bbc0d"
        VCS_REF_SHORT: "2610324f"
        VCS_REF_DATE: "2026-07-27"
        VERSION: "0.33.0.dev"
        BUILD_DATE: "2026-07-28T00:00:27+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "noble"
        OS_VERSION: "24.04"
        OS_MAJOR_VERSION: "24"
        DECIDIM_VERSION: "0.32.0"
        DECIDIM_BRANCH: "release/0.32-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "6c8254f536642f48fd6034a9a4ebb714a3e15efd"
        VCS_REF_SHORT: "6c8254f5"
        VCS_REF_DATE: "2026-07-27"
        VERSION: "0.32.0"
        BUILD_DATE: "2026-07-28T00:00:27+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        OS_NAME: "noble"
        OS_VERSION: "24.04"
        OS_MAJOR_VERSION: "24"
        DECIDIM_VERSION: "0.31.6"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "4e5899be7e827f86f64d2fd1919a4debd669701b"
        VCS_REF_SHORT: "4e5899be"
        VCS_REF_DATE: "2026-07-27"
        VERSION: "0.31.6"
        BUILD_DATE: "2026-07-28T00:00:27+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: