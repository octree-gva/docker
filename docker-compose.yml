# Docker compose file to test locally builds for ubuntu
x-default: &default
  depends_on:
    - db
    - redis

x-default-environment: &default-environment
  RAILS_ENV: production
  NODE_ENV: production
  DECIDIM_FORCE_SSL: false
  SECRET_KEY_BASE: insecure_key_base

x-default-build: &default-build
  context: ./docker
  dockerfile: ./ubuntu/Dockerfile

services:
  decidim-development:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "22.04"
        DECIDIM_VERSION: "0.33.0.dev"
        DECIDIM_BRANCH: "develop"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "d41b8c008aa049ed884c5501261920f59196056b"
        VCS_REF_SHORT: "d41b8c00"
        VCS_REF_DATE: "2026-06-05"
        VERSION: "0.33.0.dev"
        BUILD_DATE: "2026-06-07T00:03:12+00:00"
    ports:
      - "3001:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_development

  decidim-last-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "22.04"
        DECIDIM_VERSION: "0.32.0.rc3"
        DECIDIM_BRANCH: "release/0.32-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.4.7"
        VCS_REF: "2f4e630f375b1d0d1081207b308dc571a9ebc93d"
        VCS_REF_SHORT: "2f4e630f"
        VCS_REF_DATE: "2026-06-05"
        VERSION: "0.32.0.rc3"
        BUILD_DATE: "2026-06-07T00:03:12+00:00"
    ports:
      - "3002:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_last

  decidim-prev-stable:
    <<: *default
    build:
      <<: *default-build
      args:
        UBUNTU_TAG: "22.04"
        DECIDIM_VERSION: "0.31.5"
        DECIDIM_BRANCH: "release/0.31-stable"
        NODE_MAJOR_VERSION: "22"
        BUNDLER_VERSION: "2.4.20"
        RUBY_VERSION: "3.3.4"
        VCS_REF: "51bdc48d6548f41d872910bc0816fe6d0c80ceaa"
        VCS_REF_SHORT: "51bdc48d"
        VCS_REF_DATE: "2026-06-05"
        VERSION: "0.31.5"
        BUILD_DATE: "2026-06-07T00:03:12+00:00"
    ports:
      - "3003:3000"
    environment:
      <<: *default-environment
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgres://decidim:insecure_password@db:5432/decidim_prev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: insecure_password
      POSTGRES_USER: decidim
      POSTGRES_MULTIPLE_DATABASES: decidim_development,decidim_last,decidim_prev
    ports:
      - "5432:5432"
    volumes:
      - ./contrib/db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "decidim", "-c", "SELECT 1 FROM pg_database WHERE datname = 'decidim_prev';"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: